name: Build + Deploy + IndexNow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel an in-flight deploy: the auto-bot agents push to main in
  # rapid succession, and cancelling the running deploy left production stale
  # (deploys kept getting killed before completing). Queue instead so every
  # deploy finishes and the site stays current.
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: SEO audit + content checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: SEO audit
        run: node scripts/seo-audit.js
      - name: Smoke test (no server)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
      - name: Verify build output
        run: |
          test -f .next/BUILD_ID || (echo "no BUILD_ID" && exit 1)
          echo "Build output verified."

  build-deploy:
    name: Deploy + auto-publish + IndexNow
    needs: audit
    runs-on: ubuntu-latest
    # The `vercel deploy --prod` step rebuilds in the cloud (plus `npm install -g vercel`),
    # which can exceed 15 min for this large static site and get killed mid-deploy,
    # leaving production stale. Give it enough headroom to actually finish.
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_TOP: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_TOP }}
          NEXT_PUBLIC_ADSENSE_SLOT_MID: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_MID }}
          NEXT_PUBLIC_ADSENSE_SLOT_SIDE: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SIDE }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: nextjs, path: .next, retention-days: 7 }

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g vercel
          # --prebuilt reuses the .next output produced by the build step above,
          # so Vercel does NOT rebuild in the cloud (avoids the slow cloud rebuild
          # that periodically blew past the job timeout and left prod stale).
          vercel deploy --prebuilt --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: IndexNow submit
        if: always()
        run: node scripts/indexnow-submit.js || echo "IndexNow submit failed (non-fatal)"
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
