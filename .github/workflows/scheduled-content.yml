name: Scheduled content generation

on:
  push:
    branches: [main]
    paths: [.github/workflows/scheduled-content.yml]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  generate:
    name: Generate one post from keyword queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Generate one post
        run: |
          if [ ! -s scripts/keyword-queue.json ]; then
            echo "Keyword queue is empty — nothing to generate."
            exit 0
          fi
          node scripts/generate-post.js --from-keywords --batch 5
          node scripts/polish-posts.js
          for f in $(ls -1t content/posts/*.mdx | head -5); do
            node scripts/humanize-post.js "$(basename "$f" .mdx)"
          done
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      - name: Run SEO audit
        run: node scripts/seo-audit.js
      - name: Open PR with new post and enable auto-merge
        run: |
          if git diff --quiet; then
            echo "No changes to push."
            exit 0
          fi
          BRANCH="auto/content-$(date +%s)"
          git config user.email "bot@ai-blog-ten-steel.vercel.app"
          git config user.name "Auto-Publisher"
          git checkout -b "$BRANCH"
          git add content/posts/ scripts/keyword-queue.json
          git commit -m "auto: generate new post

          Generated by scheduled content engine.
          Topic: see content/posts/*.mdx for the new file."
          git push origin "$BRANCH"
          gh pr create \
            --title "auto: new content $(date +%Y-%m-%d)" \
            --body "Auto-generated by the scheduled content engine. Review and merge when ready." \
            --base main \
            --head "$BRANCH" \
            --label "auto-generated" | tee pr-url.txt
          PR_NUMBER=$(grep -oP '/pull/\K[0-9]+' pr-url.txt)
          # GitHub needs time to compute mergeability right after PR creation.
          # Poll instead of failing the run on "Pull request is in unstable status".
          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable' 2>/dev/null || echo unknown)
            if [ "$STATE" = "MERGEABLE" ]; then
              if gh pr merge --auto --squash "$PR_NUMBER" 2>/dev/null; then
                echo "Auto-merge enabled for PR #$PR_NUMBER"
                break
              fi
            fi
            echo "Mergeability=$STATE (attempt $i/30), retrying in 10s..."
            sleep 10
          done
          echo "Auto-merge step complete (non-fatal)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: IndexNow submit
        if: always()
        run: node scripts/indexnow-submit.js || echo "IndexNow submit failed (non-fatal)"
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
