name: Amazon Affiliate Agent — Link insertion

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['content/posts/**']
  workflow_dispatch:

jobs:
  affiliate:
    name: Insert Amazon affiliate links [DISABLED — Amazon links removed from site]
    if: false  # DISABLED: Amazon affiliate links were removed from the site on 2026-08-26.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Restore posted manifest
        uses: actions/cache@v4
        with:
          path: public/data/affiliate-posted.json
          key: affiliate-posted-${{ github.run_id }}
          restore-keys: |
            affiliate-posted-

      - name: Find posts missing affiliate links
        id: changes
        run: |
          node scripts/pick-pending.js affiliate content/posts "scripts/affiliate-linker.js" "$RUNNER_TEMP/changedfiles.txt"
          if [ -s "$RUNNER_TEMP/changedfiles.txt" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No posts need affiliate links."
          fi

      - name: Add affiliate links to changed posts
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          FILES=$(tr '\n' ' ' < "$RUNNER_TEMP/changedfiles.txt")
          # shellcheck disable=SC2086
          node scripts/affiliate-linker.js $FILES || echo "affiliate-linker had errors"
          # Only mark as processed the posts that now contain an Amazon link.
          node scripts/mark-processed.js affiliate $FILES
        env:
          AMAZON_ASSOCIATES_TAG: ${{ secrets.AMAZON_ASSOCIATES_TAG }}
          AMAZON_STORE_ID: ${{ secrets.AMAZON_STORE_ID }}

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          if git diff --quiet; then
            echo "No affiliate links added."
            exit 0
          fi
          BRANCH="auto/affiliate-$(date +%s)"
          git config user.email "bot@aipulsedaily.com"
          git config user.name "Affiliate Agent"
          git checkout -b "$BRANCH"
          git add content/posts/ public/data/affiliate-posted.json
          git commit -m "auto: add affiliate links $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --title "auto: affiliate links $(date +%Y-%m-%d)" --body "Inserted Amazon affiliate links." --base main --head "$BRANCH" --label auto-generated | tee pr-url.txt
          gh pr merge --squash "$(grep -oP '/pull/\K[0-9]+' pr-url.txt)" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
