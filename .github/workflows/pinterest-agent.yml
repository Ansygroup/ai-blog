name: Pinterest Agent — Auto pin generation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['content/posts/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual pins)'
        type: boolean
        default: false

jobs:
  pinterest:
    name: Create Pinterest pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Get new posts
        id: posts
        run: |
          NEW_FILES=$(git diff --name-only HEAD~1 -- content/posts/ || echo "")
          if [ -z "$NEW_FILES" ]; then
            echo "No new posts."
            echo "has_posts=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_posts=true" >> $GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW_FILES" | tail -n 5 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create pins
        if: steps.posts.outputs.has_posts == 'true'
        run: |
          for f in ${{ steps.posts.outputs.files }}; do
            if [ -f "$f" ]; then node scripts/pinterest-poster.js "$f" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}; fi
          done
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
