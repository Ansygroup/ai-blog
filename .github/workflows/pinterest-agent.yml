name: Pinterest Agent — Auto pin generation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['content/posts/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual pins)'
        type: boolean
        default: false

jobs:
  pinterest:
    name: Create Pinterest pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Restore posted manifest
        uses: actions/cache@v4
        with:
          path: public/data/pinterest-posted.json
          key: pinterest-posted-${{ github.run_id }}
          restore-keys: |
            pinterest-posted-

      - name: Find posts not yet pinned
        id: posts
        run: |
          node scripts/pick-pending.js pinterest content/posts "scripts/pinterest-poster.js" "$RUNNER_TEMP/newfiles.txt"
          if [ -s "$RUNNER_TEMP/newfiles.txt" ]; then
            echo "has_posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
            echo "No new posts to pin."
          fi

      - name: Create pins
        if: steps.posts.outputs.has_posts == 'true'
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then node scripts/pinterest-poster.js "$f" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} || echo "skip-fail: $f"; fi
          done < "$RUNNER_TEMP/newfiles.txt"
          node scripts/mark-processed.js pinterest $FILES
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
