name: Content Performance Agent — Weekly Traffic Analysis

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze and auto-fix content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Run content performance agent with auto-fix
        run: node scripts/content-performance-agent.js --fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.6-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit report and fixes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          BRANCH="auto/performance-$(date +%s)"
          git config user.email "bot@aipulsedaily.com"
          git config user.name "Content Performance Agent"
          git checkout -b "$BRANCH"
          git add content/posts/ public/reports/
          git commit -m "auto: content performance report + fixes $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --title "auto: content performance fixes $(date +%Y-%m-%d)" --body "Auto-fixes from content performance agent." --base main --head "$BRANCH" --label auto-generated | tee pr-url.txt
          PR_NUMBER=$(grep -oP '/pull/\K[0-9]+' pr-url.txt)
          gh pr merge --squash "$PR_NUMBER" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}