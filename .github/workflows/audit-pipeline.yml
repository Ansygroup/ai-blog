name: Audit Pipeline — SEO + Content Quality (no approval needed)

# ─────────────────────────────────────────────────────────────
# WHY THIS WORKFLOW EXISTS
# ─────────────────────────────────────────────────────────────
# The PR-triggered workflows (seo-audit.yml, editor-agent.yml) require
# approval when the repo has "Require approval for workflows from
# public contributors" enabled. The bot opens PRs from
# github-actions[bot], which gets blocked — the approval window expires
# in 2 seconds and the run dies before it ever executes.
#
# This workflow runs on schedule + manual dispatch, which NEVER requires
# approval. It does the same job as the PR workflows but on a timer.
#
# Trigger sources (all approval-free):
#   - schedule: every 4 hours (cron)
#   - workflow_dispatch: manual run from the Actions tab
#   - push to any branch: catches commits that bypass PRs
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Max posts to audit'
        required: false
        default: '50'
  push:
    branches:
      - 'auto/**'            # bot's content branches
      - 'main'               # direct pushes to main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # needed to comment on PRs with audit results

jobs:
  # ── 1. SEO AUDIT ──────────────────────────────────────────
  seo-audit:
    name: SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Run SEO audit
        run: node scripts/seo-audit.js
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: |
            seo-audit-report.json
            data/seo-orchestrator-report.md
          retention-days: 7

  # ── 2. CONTENT QUALITY REVIEW ─────────────────────────────
  content-review:
    name: Content quality review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Validate frontmatter on all posts
        id: validate
        run: |
          ERRORS=0
          TOTAL=0
          for f in content/posts/*.mdx; do
            [ -f "$f" ] || continue
            TOTAL=$((TOTAL+1))
            if ! head -30 "$f" | grep -q "^title:"; then
              echo "  ❌ Missing title: $f"
              ERRORS=$((ERRORS+1))
            fi
            if ! head -30 "$f" | grep -qE "^(excerpt|description):"; then
              echo "  ❌ Missing excerpt/description: $f"
              ERRORS=$((ERRORS+1))
            fi
            if ! head -30 "$f" | grep -q "^date:"; then
              echo "  ❌ Missing date: $f"
              ERRORS=$((ERRORS+1))
            fi
            if ! head -30 "$f" | grep -q "^category:"; then
              echo "  ❌ Missing category: $f"
              ERRORS=$((ERRORS+1))
            fi
            if ! head -30 "$f" | grep -q "^tags:"; then
              echo "  ❌ Missing tags: $f"
              ERRORS=$((ERRORS+1))
            fi
            WORD_COUNT=$(wc -w < "$f")
            if [ "$WORD_COUNT" -lt 500 ]; then
              echo "  ❌ Too short ($WORD_COUNT words): $f"
              ERRORS=$((ERRORS+1))
            fi
          done
          echo "TOTAL=$TOTAL" >> $GITHUB_OUTPUT
          echo "ERRORS=$ERRORS" >> $GITHUB_OUTPUT
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ Found $ERRORS issues across $TOTAL posts"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
          echo "✅ All $TOTAL posts passed validation"

      - name: Post results to PR (if triggered by push to auto/* branch)
        if: failure() && startsWith(github.ref, 'refs/heads/auto/')
        run: |
          PR_NUMBER=$(gh pr list --head ${{ github.ref_name }} --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "
          ## ❌ Audit Pipeline Failed

          **SEO Audit** and/or **Content Quality Review** found issues.

          Check the workflow run for details:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Common fixes:
          - Missing frontmatter fields → run \`node scripts/fix-frontmatter.js\`
          - Short posts → run \`node scripts/expand-thin-content.js\`
          - SEO issues → run \`node scripts/seo-optimizer.js --fix\`
            "
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. BUILD VERIFICATION ────────────────────────────────
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [seo-audit, content-review]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      - name: Verify build
        run: |
          test -f .next/BUILD_ID || (echo "❌ No BUILD_ID" && exit 1)
          echo "✅ Build verified — $(cat .next/BUILD_ID)"

  # ── 4. SUMMARY ───────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [seo-audit, content-review, build-check]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 AUDIT PIPELINE COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "SEO Audit:       ${{ needs.seo-audit.result }}"
          echo "Content Review:  ${{ needs.content-review.result }}"
          echo "Build Check:     ${{ needs.build-check.result }}"
          echo "Run ID:          ${{ github.run_id }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"