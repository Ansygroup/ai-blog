name: SEO Audit

# pull_request_target (not pull_request): runs on bot PRs WITHOUT the
# "require approval" gate that killed these runs in 2 seconds.
on:
  pull_request_target:
    paths: ['content/posts/**', 'scripts/seo-audit.js']
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours (approval-free trigger)

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Run SEO audit
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base branch by default; check out
      # the PR head explicitly so we audit the proposed content.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: SEO audit
        run: node scripts/seo-audit.js
