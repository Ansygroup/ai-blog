name: Social Agent — Share new content

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['content/posts/**']
  workflow_dispatch:

jobs:
  social:
    name: Post to social media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Restore posted manifest
        uses: actions/cache@v4
        with:
          path: public/data/social-posted.json
          key: social-posted-${{ github.run_id }}
          restore-keys: |
            social-posted-

      - name: Find posts not yet shared
        id: posts
        run: |
          node scripts/pick-pending.js social content/posts "scripts/social-content.js" "$RUNNER_TEMP/newfiles.txt"
          if [ -s "$RUNNER_TEMP/newfiles.txt" ]; then
            echo "has_posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
            echo "No new posts to share."
          fi

      - name: Post to social media
        if: steps.posts.outputs.has_posts == 'true'
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then node scripts/social-content.js "$f" || echo "skip-fail: $f"; fi
          done < "$RUNNER_TEMP/newfiles.txt"
          node scripts/mark-processed.js social $FILES
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

      - name: Commit social content (fallback)
        if: steps.posts.outputs.has_posts == 'true'
        run: |
          BRANCH="auto/social-$(date +%s)"
          git config user.email "bot@aipulsedaily.com"
          git config user.name "Social Agent"
          git checkout -b "$BRANCH"
          git add public/social/ public/data/social-posted.json
          git commit -m "auto: social content for new posts" || exit 0
          git push origin "$BRANCH"
          gh pr create --title "auto: social content $(date +%Y-%m-%d)" --body "Generated social media posts." --base main --head "$BRANCH" --label auto-generated | tee pr-url.txt
          gh pr merge --auto --squash "$(grep -oP '/pull/\K[0-9]+' pr-url.txt)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
